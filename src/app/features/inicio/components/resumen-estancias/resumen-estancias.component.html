<div class="card-estancias">
  <h3 class="card-estancias__titulo">Resumen de Estancias</h3>

  <table class="tabla">
    <thead>
      <tr>
        <th>Estancia</th>
        <th>Pacientes</th>
        <th>Admin</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (estancia of estancias; track estancia.nombreEstancia) {
        <tr>
          <td>{{ estancia.nombreEstancia }}</td>
          <td>{{ estancia.pacientes }}</td>
          <td>{{ estancia.nombreAdmin }}</td>
          <td>
            <span class="estado"
                  [class.estado--activa]="estancia.estadoEstancia"
                  [class.estado--inactiva]="!estancia.estadoEstancia">
              {{ estancia.estadoEstancia ? "Activa" : "Inactiva" }}
            </span>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="tabla__vacio">No hay estancias registradas</td>
        </tr>
      }
    </tbody>
  </table>
</div>
